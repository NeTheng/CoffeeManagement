services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    networks:
      - coffee-network
    container_name: coffee-sqlserver
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: ./CoffeeManagement.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CoffeeManagement;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=True
      - Jwt__Key=CHANGE_THIS_DEVELOPMENT_KEY_TO_A_LONG_RANDOM_SECRET_2026
      - Jwt__Issuer=CoffeeManagement.Api
      - Jwt__Audience=CoffeeManagement.Client
      - Jwt__ExpirationMinutes=60
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - coffee-network
    container_name: coffee-api

  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:5173"
    networks:
      - coffee-network
    container_name: coffee-frontend
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/index.html:/app/index.html
      - ./Frontend/vite.config.js:/app/vite.config.js
    develop:
      watch:
        - path: ./Frontend/src
          target: /app/src
          action: sync
        - path: ./Frontend/package.json
          target: /app/package.json
          action: restart

networks:
  coffee-network:
    driver: bridge

volumes:
  sqlserver-data:
