services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coffee-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/CoffeeManagement.Api/Dockerfile
    container_name: coffee-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CoffeeManagement;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "CHANGE_THIS_DEVELOPMENT_KEY_TO_A_LONG_RANDOM_SECRET_2026"
      Jwt__Issuer: "CoffeeManagement.Api"
      Jwt__Audience: "CoffeeManagement.Client"
      Jwt__ExpirationMinutes: "60"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./src/Frontend
    container_name: coffee-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:8080
    volumes:
      - ./src/Frontend/src:/app/src
    develop:
      watch:
        - path: ./src/Frontend/src
          target: /app/src
          action: sync

volumes:
  sqlserver_data:
